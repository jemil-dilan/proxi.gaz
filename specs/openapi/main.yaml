---
openapi: "3.0.3"
info:
  title: "PROXIGAZ"
  description: "REST API endpoints for PROXIGAZ"
  version: "0.1.0-dev"
  contact:
    name: "ProxiGaz backend maintainers"
    url: "https://github.com/jemil-dilan/proxi.gaz"
servers:
  - url: "https://api.proxigaz.cm"
    description: Production
  - url: "http://localhost:8080"
    description: Local development
tags:
  - name: "Demo"
    description: "Demo operations"
  - name: "User"
    description: "User identity and account operations"
  - name: "Vendor"
    description: "Vendor profile and onboarding operations"
  - name: "Audit"
    description: "Admin audit trail"
  - name: "Brand"
    description: "Gas brand reference catalogue"
paths:
  /admin/vendors:
    get:
      tags:
        - "Vendor"
      summary: "List and filter vendors"
      description: "Returns a 0-based page of vendors. `isActive` filters by activation status, `name` is a case-insensitive contains match, and `sort` defaults to `name,asc`."
      operationId: "listVendors"
      security:
        - adminAuth: []
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        - name: "isActive"
          in: "query"
          required: false
          schema:
            type: "boolean"
        - name: "name"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
            maxLength: 255
            description: "Case-insensitive contains filter on vendor name"
        - name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "name,asc"
              - "name,desc"
              - "createdAt,asc"
              - "createdAt,desc"
            default: "name,asc"
          description: "Sort field and direction. Default is name,asc."
      responses:
        "200":
          description: "Page of vendors matching the filters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPaginationDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - "Vendor"
      summary: "Create a vendor"
      description: "Creates the owning user, the vendor and its first session in one transaction. The raw `sessionToken` is returned only in this response; only its hash is stored."
      operationId: "createVendor"
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorDTO"
      responses:
        "201":
          description: "Vendor created"
          headers:
            Location:
              description: "URL of the created vendor resource"
              schema:
                type: "string"
                format: "uri"
            Cache-Control:
              description: "no-store"
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOnboardingResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/vendors/{vendorId}:
    get:
      tags:
        - "Vendor"
      summary: "Get vendor details"
      description: "Returns one vendor with its active-session metadata."
      operationId: "getVendor"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Vendor details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - "Vendor"
      summary: "Replace vendor details"
      description: "Replaces the vendor profile (full replacement). Activation changes only through `PUT /admin/vendors/{vendorId}/status`."
      operationId: "updateVendor"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdateDTO"
      responses:
        "204":
          description: "Vendor updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/vendors/{vendorId}/status:
    put:
      tags:
        - "Vendor"
      summary: "Set vendor activation status"
      description: "Activates or deactivates a vendor. An inactive vendor's session is rejected with `PROXIGAZ-403-002`."
      operationId: "setVendorStatus"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorStatusUpdateDTO"
      responses:
        "204":
          description: "Vendor activation status updated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/vendors/{vendorId}/session:
    post:
      tags:
        - "Vendor"
      summary: "Rotate the vendor session token"
      description: "Issues a new vendor session token and invalidates the previous one immediately. The raw token is returned only in this response."
      operationId: "rotateVendorSession"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "201":
          description: "New vendor bearer token; returned once"
          headers:
            Cache-Control:
              description: "no-store"
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSessionTokenDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - "Vendor"
      summary: "Revoke the vendor session token"
      description: "Revokes the vendor's active session; no token works until a new one is issued."
      operationId: "revokeVendorSession"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "Vendor session revoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /vendor/session:
    get:
      tags:
        - "Vendor"
      summary: "Return the authenticated vendor identity"
      description: "Validates the vendor bearer session and returns the vendor identity. A valid token for an inactive vendor returns 403 `PROXIGAZ-403-002`."
      operationId: "getVendorSession"
      security:
        - vendorSessionAuth: []
      responses:
        "200":
          description: "Vendor session is valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSessionIdentityDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/auth/login:
    post:
      tags:
        - "User"
      summary: "Authenticate an admin user"
      description: "Exchanges admin credentials for a JWT. Repeated failures for the same email and IP are throttled with 429 and a `Retry-After` header."
      operationId: "adminLogin"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginDTO"
      responses:
        "200":
          description: "Admin authenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/auth/me:
    get:
      tags:
        - "User"
      summary: "Return the authenticated admin identity"
      description: "Returns the identity and roles of the authenticated admin."
      operationId: "getAdminProfile"
      security:
        - adminAuth: []
      responses:
        "200":
          description: "Authenticated admin identity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfileDTO"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/brands:
    get:
      tags:
        - "Brand"
      summary: "List the brand catalogue"
      description: "Returns every brand sorted by name (case-insensitive). `isActive` restricts the list to active or inactive brands."
      operationId: "listBrands"
      security:
        - adminAuth: []
      parameters:
        - name: "isActive"
          in: "query"
          required: false
          schema:
            type: "boolean"
      responses:
        "200":
          description: "Brands sorted by name"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/BrandDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - "Brand"
      summary: "Add a brand to the catalogue"
      description: "Creates an active brand. The name is trimmed and inner whitespace collapsed; names are unique regardless of case and spacing (`PROXIGAZ-409-003`). The creation is recorded in the audit log."
      operationId: "createBrand"
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandCreateDTO"
      responses:
        "201":
          description: "Brand created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /admin/audit-log:
    get:
      tags:
        - "Audit"
      summary: "List admin audit log entries"
      description: "Returns a 0-based page of admin write actions, newest first. Filter by target with `targetType` and `targetId`; `targetId` requires `targetType`. Metadata never contains credentials or session tokens."
      operationId: "listAuditLog"
      security:
        - adminAuth: []
      parameters:
        - name: "targetType"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/AuditTargetTypeDTO"
        - name: "targetId"
          in: "query"
          required: false
          description: "Identifier of the audited target; requires `targetType`."
          schema:
            type: "string"
            format: "uuid"
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Page of audit entries, newest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPaginationDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /demo:
    get:
      tags:
        - "Demo"
      summary: "Fetch all Demos"
      description: "Fetch all Demos"
      operationId: "fetchAllDemo"
      security:
        - oAuth:
            - "demo:read:all"
      parameters:
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DemoDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - "Demo"
      summary: "Create a new Demo"
      description: "Create a new Demo"
      operationId: "createDemo"
      security:
        - oAuth:
            - "demo:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCreateDTO"
      responses:
        "201":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /demo/{demoId}:
    get:
      tags:
        - "Demo"
      summary: "Fetch demo by id"
      description: "Fetch demo by id"
      operationId: "fetchDemoById"
      security:
        - oAuth:
            - "demo:read"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "represents the id of demo to fetch."
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - "Demo"
      summary: "Replace an existing demo"
      description: "Replaces an existing Demo (reference scaffold)."
      operationId: "updateDemo"
      security:
        - oAuth:
            - "demo:update"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID of the demo to update"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoUpdateDTO"
      responses:
        "204":
          description: "Demo updated successfully"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - "Demo"
      summary: "Delete an existing demo"
      description: "Deletes an existing Demo (reference scaffold)."
      operationId: "deleteDemo"
      security:
        - oAuth:
            - "demo:delete"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID of the demo to delete"
      responses:
        "204":
          description: "Demo deleted successfully"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    adminAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Admin JWT token for back-office operations"
    vendorSessionAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "opaque"
      description: "Vendor long-lived opaque session token (not a JWT), issued once at onboarding or rotation; only its SHA-256 hash is stored."
    oAuth:
      type: "oauth2"
      description: "This API uses OAuth 2 with the Authorization Code grant flow."
      flows:
        authorizationCode:
          authorizationUrl: "https://auth.oauth.proxigaz.cm"
          tokenUrl: "https://token.oauth.proxigaz.cm"
          scopes:
            demo:read:all: "Needed to fetch all Demo objects"
            demo:create: "Needed when to create a new Demo object"
            demo:read: "Needed to fetch a Demo object by id"
            demo:update: "Needed to update a Demo object"
            demo:delete: "Needed to delete a Demo object"
  schemas:
    AdminLoginDTO:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
          minLength: 8
          writeOnly: true
    LoginResponseDTO:
      type: "object"
      required:
        - "accessToken"
        - "tokenType"
        - "expiresIn"
      properties:
        accessToken:
          type: "string"
        tokenType:
          type: "string"
          enum:
            - "Bearer"
        expiresIn:
          type: "integer"
          format: "int64"
          description: "Access token lifetime in seconds"
    AdminProfileDTO:
      type: "object"
      required:
        - "id"
        - "email"
        - "roles"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        roles:
          type: "array"
          items:
            type: "string"
          description: "List of admin roles"
    DemoDTO:
      type: "object"
      required:
        - "id"
        - "name"
        - "reference"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        reference:
          type: "string"
        description:
          type: "string"
    DemoCreateDTO:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
        description:
          type: "string"
    CreationResponseDTO:
      type: "object"
      required:
        - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
    DemoUpdateDTO:
      type: "object"
      required:
        - "name"
        - "description"
      properties:
        name:
          type: "string"
        description:
          type: "string"
    CreateVendorDTO:
      type: "object"
      required:
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "addressText"
        - "isStation"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        phone:
          type: "string"
          pattern: "^\\+237[26]\\d{8}$"
          minLength: 1
          maxLength: 32
          description: "E.164 formatted Cameroon phone number"
        latitude:
          type: "number"
          format: "double"
          minimum: 1.6
          maximum: 13.1
          description: "Latitude in Cameroon bounding box (1.6 to 13.1)"
        longitude:
          type: "number"
          format: "double"
          minimum: 8.4
          maximum: 16.2
          description: "Longitude in Cameroon bounding box (8.4 to 16.2)"
        addressText:
          type: "string"
          minLength: 1
          maxLength: 512
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
          enum:
            - "NONE"
            - "FIXED"
          description: "Delivery fee type: NONE or FIXED"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
          minimum: 0
          description: "Required when deliveryFeeType is FIXED"
    VendorUpdateDTO:
      type: "object"
      required:
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "isStation"
        - "addressText"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        phone:
          type: "string"
          pattern: "^\\+237[26]\\d{8}$"
          minLength: 1
          maxLength: 32
          description: "E.164 formatted Cameroon phone number"
        latitude:
          type: "number"
          format: "double"
          minimum: 1.6
          maximum: 13.1
          description: "Latitude in Cameroon bounding box (1.6 to 13.1)"
        longitude:
          type: "number"
          format: "double"
          minimum: 8.4
          maximum: 16.2
          description: "Longitude in Cameroon bounding box (8.4 to 16.2)"
        addressText:
          type: "string"
          minLength: 1
          maxLength: 512
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
          enum:
            - "NONE"
            - "FIXED"
          description: "Delivery fee type: NONE or FIXED"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
          minimum: 0
          description: "Required when deliveryFeeType is FIXED"
    VendorOnboardingResponseDTO:
      type: "object"
      required:
        - "vendorId"
        - "sessionToken"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        sessionToken:
          type: "string"
          description: "One-time bearer credential; it is not returned again after onboarding."
    VendorStatusUpdateDTO:
      type: "object"
      required:
        - "isActive"
      properties:
        isActive:
          type: "boolean"
    VendorDTO:
      type: "object"
      required:
        - "vendorId"
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "isStation"
        - "isActive"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
          maxLength: 254
          nullable: true
          description: "Admin contact email"
        phone:
          type: "string"
        latitude:
          type: "number"
          format: "double"
        longitude:
          type: "number"
          format: "double"
        addressText:
          type: "string"
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
        isActive:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the vendor was created"
        updatedAt:
          type: "string"
          format: "date-time"
          description: "When the vendor was last updated"
        hasActiveSession:
          type: "boolean"
          description: "Whether the vendor has an active session"
        sessionCreatedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the vendor session was created"
        sessionLastUsedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the vendor session was last used"
    VendorPaginationDTO:
      type: "object"
      required:
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/VendorDTO"
        page:
          type: "integer"
        size:
          type: "integer"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
    VendorSessionTokenDTO:
      type: "object"
      required:
        - "sessionToken"
      properties:
        sessionToken:
          type: "string"
          description: "New one-time bearer credential; the previous token is revoked."
    VendorSessionIdentityDTO:
      type: "object"
      required:
        - "vendorId"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          description: "Vendor name"
        isActive:
          type: "boolean"
          description: "Whether the vendor is active"
    AuditTargetTypeDTO:
      type: "string"
      description: "Audit target types accepted by the `targetType` filter."
      enum:
        - "VENDOR"
        - "BRAND"
    AuditLogEntryDTO:
      type: "object"
      required:
        - "id"
        - "adminUserId"
        - "action"
        - "targetType"
        - "targetId"
        - "metadata"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        adminUserId:
          type: "string"
          format: "uuid"
          description: "Admin user who performed the action"
        adminEmail:
          type: "string"
          format: "email"
          nullable: true
          description: "Email of that admin, when known"
        action:
          type: "string"
          description: "Admin write action. The set grows as features are audited: clients must accept values not listed here."
          x-extensible-enum:
            - "VENDOR_CREATED"
            - "VENDOR_UPDATED"
            - "VENDOR_ACTIVATED"
            - "VENDOR_DEACTIVATED"
            - "VENDOR_SESSION_ROTATED"
            - "VENDOR_SESSION_REVOKED"
            - "BRAND_CREATED"
        targetType:
          type: "string"
          description: "Kind of audited resource. The set grows as features are audited: clients must accept values not listed here."
          x-extensible-enum:
            - "VENDOR"
            - "BRAND"
        targetId:
          type: "string"
          format: "uuid"
        metadata:
          type: "object"
          additionalProperties: true
          description: "Action details: `isActive` (created), `changedFields` (updated), `previousActive` (status). Never credentials or tokens."
        createdAt:
          type: "string"
          format: "date-time"
    AuditLogPaginationDTO:
      type: "object"
      required:
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/AuditLogEntryDTO"
        page:
          type: "integer"
        size:
          type: "integer"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
    BrandDTO:
      type: "object"
