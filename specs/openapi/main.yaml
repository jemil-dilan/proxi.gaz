---
openapi: "3.0.3"
info:
  title: "PROXIGAZ"
  description: "REST API endpoints for PROXIGAZ"
  version: "2026-W40"
servers:
  - url: "https://api.proxigaz.cm"
  - url: "http://localhost:8080"
tags:
  - name: "Demo"
    description: "Demo operations"
  - name: "User"
    description: "User identity and account operations"
  - name: "Vendor"
    description: "Vendor profile and onboarding operations"
paths:
  /admin/vendors:
    get:
      tags:
        - "Vendor"
      summary: "List and filter vendors"
      operationId: "listVendors"
      security:
        - adminAuth: []
      parameters:
        - name: "page"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
        - name: "size"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        - name: "isActive"
          in: "query"
          required: false
          schema:
            type: "boolean"
        - name: "name"
          in: "query"
          required: false
          schema:
            type: "string"
            minLength: 1
            maxLength: 255
            description: "Case-insensitive contains filter on vendor name"
        - name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "name,asc"
              - "name,desc"
              - "createdAt,asc"
              - "createdAt,desc"
            default: "name,asc"
            description: "Sort order: name or createdAt, with asc/desc direction"
      responses:
        "200":
          description: "Page of vendors matching the filters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPaginationDTO"
        "400":
          description: "Invalid pagination or filter value"
    post:
      tags:
        - "Vendor"
      summary: "Create a vendor"
      operationId: "createVendor"
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVendorDTO"
      responses:
        "201":
          description: "Vendor created"
          headers:
            Location:
              description: "URL of the created vendor resource"
              schema:
                type: "string"
                format: "uri"
            Cache-Control:
              description: "no-store"
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOnboardingResponseDTO"
        "400":
          description: "Invalid vendor details"
  /admin/vendors/{vendorId}:
    get:
      tags:
        - "Vendor"
      summary: "Get vendor details"
      operationId: "getVendor"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Vendor details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDetailDTO"
        "404":
          description: "Vendor not found"
    put:
      tags:
        - "Vendor"
      summary: "Replace vendor details"
      operationId: "updateVendor"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdateDTO"
      responses:
        "204":
          description: "Vendor updated"
        "400":
          description: "Invalid vendor details"
        "404":
          description: "Vendor not found"
  /admin/vendors/{vendorId}/status:
    put:
      tags:
        - "Vendor"
      summary: "Set vendor activation status"
      operationId: "setVendorStatus"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorStatusUpdateDTO"
      responses:
        "204":
          description: "Vendor activation status updated"
        "400":
          description: "Invalid vendor status"
        "404":
          description: "Vendor not found"
  /admin/vendors/{vendorId}/session:
    post:
      tags:
        - "Vendor"
      summary: "Rotate the vendor session token"
      operationId: "rotateVendorSession"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "New vendor bearer token; returned once"
          headers:
            Cache-Control:
              description: "no-store"
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSessionTokenDTO"
        "404":
          description: "Vendor not found"
    delete:
      tags:
        - "Vendor"
      summary: "Revoke the vendor session token"
      operationId: "revokeVendorSession"
      security:
        - adminAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "Vendor session revoked"
        "404":
          description: "Vendor not found"
  /vendor/session:
    get:
      tags:
        - "Vendor"
      summary: "Return the authenticated vendor identity"
      operationId: "getVendorSession"
      security:
        - vendorSessionAuth: []
      responses:
        "200":
          description: "Vendor session is valid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSessionIdentityDTO"
        "401":
          description: "Vendor session is invalid or revoked"
        "403":
          description: "Vendor is inactive (PROXIGAZ-403-002)"
  /admin/auth/login:
    post:
      tags:
        - "User"
      summary: "Authenticate an admin user"
      operationId: "adminLogin"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginDTO"
      responses:
        "200":
          description: "Admin authenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
        "400":
          description: "Invalid login request"
        "401":
          description: "Email or password is invalid"
        "429":
          description: "Too many login attempts. Retry after the time specified in Retry-After header."
          headers:
            Retry-After:
              description: "Seconds to wait before retrying"
              schema:
                type: "integer"
  /admin/auth/me:
    get:
      tags:
        - "User"
      summary: "Return the authenticated admin identity"
      operationId: "getAdminProfile"
      security:
        - adminAuth: []
      responses:
        "200":
          description: "Authenticated admin identity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfileDTO"
        "401":
          description: "Missing or invalid access token"
  /demo:
    get:
      tags:
        - "Demo"
      summary: "Fetch all Demos"
      description: "Fetch all Demos"
      operationId: "fetchAllDemo"
      security:
        - oAuth:
            - "demo:read:all"
      parameters:
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DemoDTO"
    post:
      tags:
        - "Demo"
      summary: "Create a new Demo"
      description: "Create a new Demo"
      operationId: "createDemo"
      security:
        - oAuth:
            - "demo:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCreateDTO"
      responses:
        "201":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseDTO"
        "409":
          description: "PROXIGAZ-409-000 – Demo name already exists"
  /demo/{demoId}:
    get:
      tags:
        - "Demo"
      summary: "Fetch demo by id"
      description: "Fetch demo by id"
      operationId: "fetchDemoById"
      security:
        - oAuth:
            - "demo:read"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "represents the id of demo to fetch."
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDTO"
        "404":
          description: "PROXIGAZ-404-000 – Demo not found"
    put:
      tags:
        - "Demo"
      summary: "Replace an existing demo"
      operationId: "updateDemo"
      security:
        - oAuth:
            - "demo:update"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID of the demo to update"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoUpdateDTO"
      responses:
        "204":
          description: "Demo updated successfully"
        "404":
          description: "PROXIGAZ-404-000 – Demo not found"
        "409":
          description: "PROXIGAZ-409-000 – Demo name already in use by another demo"
    delete:
      tags:
        - "Demo"
      summary: "Delete an existing demo"
      operationId: "deleteDemo"
      security:
        - oAuth:
            - "demo:delete"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID of the demo to delete"
      responses:
        "204":
          description: "Demo deleted successfully"
        "404":
          description: "PROXIGAZ-404-000 – Demo not found"
components:
  securitySchemes:
    adminAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Admin JWT token for back-office operations"
    vendorSessionAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Vendor long-lived opaque session token for vendor operations"
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    oAuth:
      type: "oauth2"
      description: "This API uses OAuth 2 with the Authorization Code grant flow."
      flows:
        authorizationCode:
          authorizationUrl: "https://auth.oauth.proxigaz.cm"
          tokenUrl: "https://token.oauth.proxigaz.cm"
          scopes:
            demo:read:all: "Needed to fetch all Demo objects"
            demo:create: "Needed when to create a new Demo object"
            demo:read: "Needed to fetch a Demo object by id"
            demo:update: "Needed to update a Demo object"
            demo:delete: "Needed to delete a Demo object"
  schemas:
    AdminLoginDTO:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
          minLength: 8
          writeOnly: true
    LoginResponseDTO:
      type: "object"
      required:
        - "accessToken"
        - "tokenType"
        - "expiresIn"
      properties:
        accessToken:
          type: "string"
        tokenType:
          type: "string"
          enum:
            - "Bearer"
        expiresIn:
          type: "integer"
          format: "int64"
          description: "Access token lifetime in seconds"
    AdminProfileDTO:
      type: "object"
      required:
        - "id"
        - "email"
        - "roles"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        roles:
          type: "array"
          items:
            type: "string"
          description: "List of admin roles"
    DemoDTO:
      type: "object"
      required:
        - "id"
        - "name"
        - "reference"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        reference:
          type: "string"
        description:
          type: "string"
    DemoCreateDTO:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
        description:
          type: "string"
    CreationResponseDTO:
      type: "object"
      required:
        - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
    DemoUpdateDTO:
      type: "object"
      required:
        - "name"
        - "description"
      properties:
        name:
          type: "string"
        description:
          type: "string"
    CreateVendorDTO:
      type: "object"
      required:
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "addressText"
        - "isStation"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        phone:
          type: "string"
          pattern: "^\\+237[26]\\d{8}$"
          minLength: 1
          maxLength: 32
          description: "E.164 formatted Cameroon phone number"
        latitude:
          type: "number"
          format: "double"
          minimum: 1.6
          maximum: 13.1
          description: "Latitude in Cameroon bounding box (1.6 to 13.1)"
        longitude:
          type: "number"
          format: "double"
          minimum: 8.4
          maximum: 16.2
          description: "Longitude in Cameroon bounding box (8.4 to 16.2)"
        addressText:
          type: "string"
          minLength: 1
          maxLength: 512
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
          enum:
            - "NONE"
            - "FIXED"
          description: "Delivery fee type: NONE or FIXED"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
          minimum: 0
          description: "Required when deliveryFeeType is FIXED"
    VendorUpdateDTO:
      type: "object"
      required:
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "isStation"
        - "addressText"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        phone:
          type: "string"
          pattern: "^\\+237[26]\\d{8}$"
          minLength: 1
          maxLength: 32
          description: "E.164 formatted Cameroon phone number"
        latitude:
          type: "number"
          format: "double"
          minimum: 1.6
          maximum: 13.1
          description: "Latitude in Cameroon bounding box (1.6 to 13.1)"
        longitude:
          type: "number"
          format: "double"
          minimum: 8.4
          maximum: 16.2
          description: "Longitude in Cameroon bounding box (8.4 to 16.2)"
        addressText:
          type: "string"
          minLength: 1
          maxLength: 512
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
          enum:
            - "NONE"
            - "FIXED"
          description: "Delivery fee type: NONE or FIXED"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
          minimum: 0
          description: "Required when deliveryFeeType is FIXED"
    VendorOnboardingResponseDTO:
      type: "object"
      required:
        - "vendorId"
        - "sessionToken"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        sessionToken:
          type: "string"
          description: "One-time bearer credential; it is not returned again after onboarding."
    VendorStatusUpdateDTO:
      type: "object"
      required:
        - "isActive"
      properties:
        isActive:
          type: "boolean"
    VendorDTO:
      type: "object"
      required:
        - "vendorId"
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "isStation"
        - "isActive"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
          maxLength: 254
          nullable: true
          description: "Admin contact email"
        phone:
          type: "string"
        latitude:
          type: "number"
          format: "double"
        longitude:
          type: "number"
          format: "double"
        addressText:
          type: "string"
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
        isActive:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the vendor was created"
        updatedAt:
          type: "string"
          format: "date-time"
          description: "When the vendor was last updated"
    VendorDetailDTO:
      type: "object"
      required:
        - "vendorId"
        - "name"
        - "phone"
        - "latitude"
        - "longitude"
        - "isStation"
        - "isActive"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        email:
          type: "string"
          format: "email"
          maxLength: 254
          nullable: true
          description: "Admin contact email"
        phone:
          type: "string"
        latitude:
          type: "number"
          format: "double"
        longitude:
          type: "number"
          format: "double"
        addressText:
          type: "string"
        isStation:
          type: "boolean"
        deliveryFeeType:
          type: "string"
        deliveryFeeAmount:
          type: "integer"
          format: "int32"
        isActive:
          type: "boolean"
        createdAt:
          type: "string"
          format: "date-time"
          description: "When the vendor was created"
        updatedAt:
          type: "string"
          format: "date-time"
          description: "When the vendor was last updated"
        hasActiveSession:
          type: "boolean"
          description: "Whether the vendor has an active session"
        sessionCreatedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the vendor session was created"
        sessionLastUsedAt:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the vendor session was last used"
    VendorPaginationDTO:
      type: "object"
      required:
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        content:
          type: "array"
          items:
            $ref: "#/components/schemas/VendorDTO"
        page:
          type: "integer"
        size:
          type: "integer"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
    VendorSessionTokenDTO:
      type: "object"
      required:
        - "sessionToken"
      properties:
        sessionToken:
          type: "string"
          description: "New one-time bearer credential; the previous token is revoked."
    VendorSessionIdentityDTO:
      type: "object"
      required:
        - "vendorId"
      properties:
        vendorId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          description: "Vendor name"
        isActive:
          type: "boolean"
          description: "Whether the vendor is active"
