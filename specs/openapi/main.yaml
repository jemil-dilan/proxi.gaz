---
openapi: "3.0.3"
info:
  title: "PROXIGAZ"
  description: "REST API endpoints for PROXIGAZ"
  version: "2026-W40"
servers:
  - url: "https://api.proxigaz.cm"
  - url: "http://localhost:8080"
tags:
  - name: "Demo"
    description: "Demo operations"
  - name: "AdminAuth"
    description: "Admin login and identity operations"
  - name: "AdminVendor"
    description: "Admin vendor management"
paths:
  /admin/vendors:
    post:
      tags: ["AdminVendor"]
      summary: "Create a vendor"
      operationId: "createVendor"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorDetailsDTO"
      responses:
        "201":
          description: "Vendor created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseDTO"
        "400":
          description: "Invalid vendor details"
  /admin/vendors/{vendorId}:
    put:
      tags: ["AdminVendor"]
      summary: "Replace vendor details"
      operationId: "updateVendor"
      security:
        - bearerAuth: []
      parameters:
        - name: "vendorId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorDetailsDTO"
      responses:
        "204":
          description: "Vendor updated"
        "400":
          description: "Invalid vendor details"
        "404":
          description: "Vendor not found"
  /admin/auth/login:
    post:
      tags:
        - "AdminAuth"
      summary: "Authenticate an admin user"
      operationId: "adminLogin"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginDTO"
      responses:
        "200":
          description: "Admin authenticated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseDTO"
        "400":
          description: "Invalid login request"
        "401":
          description: "Email or password is invalid"
  /admin/auth/me:
    get:
      tags:
        - "AdminAuth"
      summary: "Return the authenticated admin identity"
      operationId: "getAdminProfile"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Authenticated admin identity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProfileDTO"
        "401":
          description: "Missing or invalid access token"
  /demo:
    get:
      tags:
        - "Demo"
      summary: "Fetch all Demos"
      description: "Fetch all Demos"
      operationId: "fetchAllDemo"
      security:
        - oAuth:
            - "demo:read:all"
      parameters:
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/DemoDTO"
    post:
      tags:
        - "Demo"
      summary: "Create a new Demo"
      description: "Create a new Demo"
      operationId: "createDemo"
      security:
        - oAuth:
            - "demo:create"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCreateDTO"
      responses:
        "201":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseDTO"
        "409":
          description: "PROXIGAZ-409-000 – Demo name already exists"
  /demo/{demoId}:
    get:
      tags:
        - "Demo"
      summary: "Fetch demo by id"
      description: "Fetch demo by id"
      operationId: "fetchDemoById"
      security:
        - oAuth:
            - "demo:read"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "represents the id of demo to fetch."
        - name: "fieldsToExtractCode"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "specify the fields that will be present on the response"
      responses:
        "200":
          description: "successful operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoDTO"
        "404":
          description: "PROXIGAZ-404-000 – Demo not found"
    put:
      tags:
        - "Demo"
      summary: "Replace an existing demo"
      operationId: "updateDemo"
      security:
        - oAuth:
            - "demo:update"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID of the demo to update"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoUpdateDTO"
      responses:
        "204":
          description: "Demo updated successfully"
        "404":
          description: "PROXIGAZ-404-000 – Demo not found"
        "409":
          description: "PROXIGAZ-409-000 – Demo name already in use by another demo"
    delete:
      tags:
        - "Demo"
      summary: "Delete an existing demo"
      operationId: "deleteDemo"
      security:
        - oAuth:
            - "demo:delete"
      parameters:
        - name: "demoId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
          description: "UUID of the demo to delete"
      responses:
        "204":
          description: "Demo deleted successfully"
        "404":
          description: "PROXIGAZ-404-000 – Demo not found"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
    oAuth:
      type: "oauth2"
      description: "This API uses OAuth 2 with the Authorization Code grant flow."
      flows:
        authorizationCode:
          authorizationUrl: "https://auth.oauth.proxigaz.cm"
          tokenUrl: "https://token.oauth.proxigaz.cm"
          scopes:
            demo:read:all: "Needed to fetch all Demo objects"
            demo:create: "Needed when to create a new Demo object"
            demo:read: "Needed to fetch a Demo object by id"
            demo:update: "Needed to update a Demo object"
            demo:delete: "Needed to delete a Demo object"
  schemas:
    AdminLoginDTO:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
        password:
          type: "string"
          format: "password"
          writeOnly: true
    LoginResponseDTO:
      type: "object"
      required:
        - "accessToken"
        - "tokenType"
        - "expiresIn"
      properties:
        accessToken:
          type: "string"
        tokenType:
          type: "string"
          enum:
            - "Bearer"
        expiresIn:
          type: "integer"
          format: "int64"
          description: "Access token lifetime in seconds"
    AdminProfileDTO:
      type: "object"
      required:
        - "id"
        - "email"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
    DemoDTO:
      type: "object"
      required:
        - "id"
        - "name"
        - "reference"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        reference:
          type: "string"
        description:
          type: "string"
    DemoCreateDTO:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
        description:
          type: "string"
    CreationResponseDTO:
      type: "object"
      required:
        - "newId"
      properties:
        newId:
          type: "string"
          format: "uuid"
    DemoUpdateDTO:
      type: "object"
      required:
        - "name"
        - "description"
      properties:
        name:
          type: "string"
        description:
          type: "string"
    VendorDetailsDTO:
      type: "object"
      required: ["name", "phone", "latitude", "longitude", "isStation", "isActive"]
      properties:
        name: { type: "string" }
        phone: { type: "string" }
        latitude: { type: "number", format: "double" }
        longitude: { type: "number", format: "double" }
        addressText: { type: "string" }
        isStation: { type: "boolean" }
        deliveryFeeType: { type: "string" }
        deliveryFeeAmount: { type: "integer", format: "int32" }
        isActive: { type: "boolean" }
