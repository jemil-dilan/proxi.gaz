name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    name: Spotless Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless check
        run: ./gradlew spotlessJavaCheck --parallel

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: spotless
    # Remove this block if your tests only use Testcontainers
    # (Testcontainers starts its own Postgres; Docker is preinstalled).
    services:
      postgres:
        # Keep in sync with TestcontainersConfiguration.POSTGIS_IMAGE
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: proxigaz
          POSTGRES_PASSWORD: proxigaz
          POSTGRES_DB: proxigaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U proxigaz"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew test --parallel

      - name: Run data tests
        run: ./gradlew dataTest

      - name: Run e2e tests
        run: ./gradlew e2eTest

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

  dependency-check:
    name: Dependency Check (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            --project "ProxiGaz"
            --scan "."
            --format "HTML"
            --out "/github/workspace/reports"
            --noupdate
            --failOnCVSS "7"
            --enableExperimental
          )
          if [[ -n "$NVD_API_KEY" ]]; then
            args+=(--nvdApiKey "$NVD_API_KEY")
          fi
          docker run --rm \
            --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            owasp/dependency-check-action:latest \
            "${args[@]}"

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 7

  security-scan:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # JDK must be set up BEFORE CodeQL init so the traced build uses it
      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - name: Build for CodeQL
        run: ./gradlew compileJava --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
