name: Build and push Docker image to Docker Hub

on:
  push:
    branches:
      - main
      - working/*
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build with Jib and push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # For tags: v0.1.0 -> 0.1.0
            TAG=${GITHUB_REF#refs/tags/v}
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # For main branch: use latest
            TAG="latest"
          else
            # For feature branches: use branch name sanitized
            TAG=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-' | tr '.' '-' | tr '[:upper:]' '[:lower:]')
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push with Jib
        run: ./gradlew jib -Pjib.to.image=docker.io/jemildilan/proxi.gaz -Pjib.to.tags=${{ steps.tag.outputs.tag }} -Pjib.to.additionalImages=ghcr.io/jemil-dilan/proxi.gaz:${{ steps.tag.outputs.tag }}

      - name: Output image info
        run: |
          echo "Built and pushed images:"
          echo "  Docker Hub: docker.io/jemildilan/proxi.gaz:${{ steps.tag.outputs.tag }}"
          echo "  GHCR: ghcr.io/jemil-dilan/proxi.gaz:${{ steps.tag.outputs.tag }}"
