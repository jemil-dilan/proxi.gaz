name: Build, publish, and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the leading v (for example 0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: proxigaz
          POSTGRES_PASSWORD: proxigaz
          POSTGRES_DB: proxigaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U proxigaz"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Check out selected release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require main and validate release metadata
        id: validate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^0\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version must be pre-1.0 SemVer without a leading v." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          if [[ ! -s "$NOTES" ]]; then
            echo "Release notes are required at ${NOTES}." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          else
            lookup_status=$?
            if [[ "$lookup_status" -ne 2 ]]; then
              echo "Could not verify whether tag ${TAG} already exists." >&2
              exit "$lookup_status"
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: ./gradlew spotlessJavaCheck --parallel

      - name: Run unit tests
        run: ./gradlew test --parallel

      - name: Run data tests
        run: ./gradlew dataTest

      - name: Run end-to-end tests
        run: ./gradlew e2eTest

  publish-image:
    name: Build and publish image with Jib
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      version: ${{ needs.verify.outputs.version }}
    steps:
      - name: Set image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "dockerhub_image=docker.io/jemildilan/proxi.gaz" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish with Jib to both registries
        run: ./gradlew jib -Pjib.to.image=${{ steps.image.outputs.dockerhub_image }} -Pjib.to.tags=${{ steps.image.outputs.version }},latest -Pjib.to.additionalImages=${{ steps.image.outputs.ghcr_image }}:${{ steps.image.outputs.version }},${{ steps.image.outputs.ghcr_image }}:latest

publish-release:
    name: Create annotated tag and GitHub Release
    needs: [verify, publish-image]
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release ${TAG}"
          git push origin "$TAG"
          {
            cat "$NOTES"
            printf '\n## Published container images\n\n'
            printf 'Docker Hub: `docker.io/jemildilan/proxi.gaz:%s`\n' "${VERSION}"
            printf 'GHCR: `ghcr.io/jemil-dilan/proxi.gaz:%s`\n' "${VERSION}"
          } > /tmp/release-notes.md
          RELEASE_FLAGS=()
          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            "${RELEASE_FLAGS[@]}"
