
name: Build, publish, and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without leading v (example: 0.1.0-alpha.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: proxigaz-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: proxigaz
          POSTGRES_PASSWORD: proxigaz
          POSTGRES_DB: proxigaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U proxigaz"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}

    steps:
      - name: Check out selected release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release metadata
        id: validate
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Dispatch this workflow from main." >&2
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            echo "Expected a pre-1.0 version such as 0.1.0 or 0.1.0-alpha.1." >&2
            exit 1
          fi

          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"

          if [[ ! -s "$NOTES" ]]; then
            echo "Release notes are missing or empty: $NOTES" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}"

            EXISTING_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"

            if [[ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already exists on another commit." >&2
              exit 1
            fi

            echo "Tag $TAG already exists on the selected commit."

          else
            LOOKUP_STATUS=$?

            if [[ "$LOOKUP_STATUS" -ne 2 ]]; then
              echo "Could not verify whether tag $TAG exists." >&2
              exit "$LOOKUP_STATUS"
            fi

            echo "Tag $TAG is available."
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting
        run: |
          ./gradlew --no-daemon spotlessJavaCheck \
            -PappVersion="${{ inputs.version }}" \
            --parallel --console=plain

      - name: Run unit tests
        run: |
          ./gradlew --no-daemon test \
            -PappVersion="${{ inputs.version }}" \
            --parallel --console=plain

      - name: Run data tests
        run: |
          ./gradlew --no-daemon dataTest \
            -PappVersion="${{ inputs.version }}" \
            --console=plain

      - name: Run end-to-end tests
        run: |
          ./gradlew --no-daemon e2eTest \
            -PappVersion="${{ inputs.version }}" \
            --console=plain

  publish-image:
    name: Build and publish production images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish to Docker Hub
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: docker.io/mohamednfonka/proxi.gaz
        run: |
          set -euo pipefail

          ./gradlew --no-daemon jib \
            -PappVersion="$VERSION" \
            -Djib.to.image="$IMAGE" \
            -Djib.to.tags="$VERSION,latest" \
            --console=plain

      - name: Verify Docker Hub images
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: docker.io/mohamednfonka/proxi.gaz
        run: |
          set -euo pipefail

          docker pull "$IMAGE:$VERSION"
          docker pull "$IMAGE:latest"

      - name: Build and publish to GHCR
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ghcr.io/jemil-dilan/proxi.gaz
        run: |
          set -euo pipefail

          ./gradlew --no-daemon jib \
            -PappVersion="$VERSION" \
            -Djib.to.image="$IMAGE" \
            -Djib.to.tags="$VERSION,latest" \
            --console=plain

      - name: Verify GHCR images
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          IMAGE: ghcr.io/jemil-dilan/proxi.gaz
        run: |
          set -euo pipefail

          docker pull "$IMAGE:$VERSION"
          docker pull "$IMAGE:latest"

      - name: Display production images
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "Production images published and verified."
          echo ""
          echo "Docker Hub:"
          echo "  docker.io/mohamednfonka/proxi.gaz:$VERSION"
          echo "  docker.io/mohamednfonka/proxi.gaz:latest"
          echo ""
          echo "GHCR:"
          echo "  ghcr.io/jemil-dilan/proxi.gaz:$VERSION"
          echo "  ghcr.io/jemil-dilan/proxi.gaz:latest"

  publish-release:
    name: Create Git tag and GitHub Release
    needs:
      - verify
      - publish-image

    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: release-approval

    permissions:
      contents: write

    steps:
      - name: Check out verified release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create annotated Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="docs/releases/${TAG}.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}"

            EXISTING_COMMIT="$(git rev-parse 'FETCH_HEAD^{commit}')"

            if [[ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Existing tag points to another commit." >&2
              exit 1
            fi

            echo "Using existing tag $TAG."

          else
            LOOKUP_STATUS=$?

            if [[ "$LOOKUP_STATUS" -ne 2 ]]; then
              echo "Unable to verify remote tag." >&2
              exit "$LOOKUP_STATUS"
            fi

            git tag -a "$TAG" "$GITHUB_SHA" -m "Release ${TAG}"
            git push origin "$TAG"

            echo "Created and pushed tag $TAG."
          fi

          {
            cat "$NOTES"

            printf '\n\n## Published container images\n\n'

            printf '%s\n' \
              "### Docker Hub" \
              "\`docker.io/mohamednfonka/proxi.gaz:${VERSION}\`" \
              "\`docker.io/mohamednfonka/proxi.gaz:latest\`" \
              ""

            printf '%s\n' \
              "### GitHub Container Registry" \
              "\`ghcr.io/jemil-dilan/proxi.gaz:${VERSION}\`" \
              "\`ghcr.io/jemil-dilan/proxi.gaz:latest\`"
          } > /tmp/release-notes.md

          RELEASE_FLAGS=()

          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              "${RELEASE_FLAGS[@]}"

            echo "GitHub Release $TAG successfully created."
          fi
