name: API scenarios (remote)

# Runs the API scenario collection against a deployed environment, e.g. staging once it exists.
# PRs run the same scenarios against the local Compose stack in ci.yml (job "API Scenarios").
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Scenario environment file (api-scenarios/env/<name>.env)"
        required: true
        default: staging
        type: choice
        options:
          - staging
      base_url:
        description: "Optional base URL overriding the environment file (https://...)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  scenarios:
    name: API scenarios against ${{ inputs.environment }}
    # Pinned: the prebuilt Hurl binary needs libxml2.so.2, which Ubuntu 26.04 no longer ships.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pinned Hurl
        run: |
          scripts/install-hurl.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run API scenarios
        env:
          PROXIGAZ_SCENARIO_BASE_URL: ${{ inputs.base_url }}
          PROXIGAZ_SCENARIO_ADMIN_EMAIL: ${{ secrets.PROXIGAZ_SCENARIO_ADMIN_EMAIL }}
          PROXIGAZ_SCENARIO_ADMIN_PASSWORD: ${{ secrets.PROXIGAZ_SCENARIO_ADMIN_PASSWORD }}
          # Free hosts sleep when idle: allow time for a cold start.
          PROXIGAZ_SCENARIO_HEALTH_TIMEOUT: "300"
        run: scripts/run-api-scenarios.sh "${{ inputs.environment }}"

      - name: Upload scenario report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-scenarios-${{ inputs.environment }}
          path: build/api-scenarios/
          retention-days: 14
