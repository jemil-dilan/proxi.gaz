---
spring:
  liquibase:
    contexts: "local"
  jpa:
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/proxigaz}"
    username: "${DB_USER:proxigaz}"
    password: "${DB_PASSWORD:proxigaz}"
proxigaz:
  security:
    jwt:
      secret: "${JWT_SECRET:proxigaz-dev-secret-key-0123456789abcdef0123456789abcdef}"
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
logging:
  level:
    cm.jemil.proxi.gaz: "DEBUG"
    org.hibernate.SQL: "DEBUG"
    org.hibernate.orm.jdbc.bind: "TRACE"
    org.springframework.jdbc.core.JdbcTemplate: "DEBUG"
    org.springframework.orm.jpa.JpaTransactionManager: "DEBUG"
