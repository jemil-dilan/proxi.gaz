---
spring:
  application:
    name: "proxi.gaz"
    version: "0.0.0-SNAPSHOT"
  profiles:
    default: "local"
  liquibase:
    change-log: "classpath:/cm/jemil/proxi/gaz/infrastructure/persistence/liquibase/changelog/master.xml"
    enabled: true
    contexts: "${LIQUIBASE_CONTEXT:}"
  jpa:
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
proxigaz:
  security:
    jwt:
      access-token-ttl: "${PROXIGAZ_SECURITY_JWT_ACCESS_TOKEN_TTL:15m}"
  admin:
    bootstrap:
      enabled: "${PROXIGAZ_ADMIN_BOOTSTRAP_ENABLED:false}"
      email: "${PROXIGAZ_ADMIN_BOOTSTRAP_EMAIL:}"
      password: "${PROXIGAZ_ADMIN_BOOTSTRAP_PASSWORD:}"
