services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: proxigaz
      POSTGRES_USER: proxigaz
      POSTGRES_PASSWORD: proxigaz
    volumes:
      - proxigaz-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxigaz -d proxigaz"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-local}
    image: proxigaz:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_VERSION: ${APP_VERSION:-0.0.0-local}
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://db:5432/proxigaz
      DB_USER: proxigaz
      DB_PASSWORD: proxigaz
      JWT_SECRET: proxigaz-local-compose-secret-0123456789abcdef
    ports:
      - "8080:8080"

volumes:
  proxigaz-db:
